name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Publish a GitHub Release with this version (e.g. 1.0.0). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (release)
        run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/dm-sounds.exe dist/DM-Sounds.exe
          Copy-Item README.md, CREDITS.md, LICENSE dist/
      - uses: actions/upload-artifact@v4
        with:
          name: DM-Sounds-windows-x64
          path: dist/
      # A release is cut either by pushing a v* tag or by running the
      # workflow by hand with a version; the latter creates the tag itself.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_version != ''
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath DM-Sounds-windows-x64.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_version != ''
        with:
          tag_name: ${{ inputs.release_version != '' && format('v{0}', inputs.release_version) || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: DM Sounds ${{ inputs.release_version != '' && inputs.release_version || github.ref_name }}
          body: |
            Windows x64 build. Unzip and run `DM-Sounds.exe`; nothing to install.
            Sounds and fonts are embedded; see CREDITS.md for licences.
          files: DM-Sounds-windows-x64.zip

  linux:
    name: Linux x64 (check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo fmt --check
      - run: cargo clippy --release --locked -- -D warnings
      - run: cargo build --release --locked
